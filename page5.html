<script>
var p5Nama='', p5Ready=false, p5Mode='lihat', p5Edit=false;

// Field IDENTITAS yang dikunci (abu-abu) saat membuat laporan baru.
var P5_LOCK = ['p5tanggal','p5dinas','p5namahidden','p5pasien',
               'p5umur','p5harike','p5agama','p5jaminan','p5dpjp','p5dpjplain'];
// Field bebas-teks (bukan checkbox) yang isinya ikut ditulis ke kolom I sbg
// token Key=Value, SELALU ditulis walau kosong/default (lihat p5Kumpul/p5ApplyKV).
var P5_PPI_FIELDS = ['p5ppiTindakan','p5ppiKultur','p5ppiSuhu'];
// Antibiotik: 5 slot x (Nama select + Freq teks bebas + Dosis teks bebas). Slot
// yang Nama-nya kosong TIDAK ditulis ke kolom I (lihat p5Kumpul).
var P5_AB_FIELDS = [];
for(var p5abI=1; p5abI<=5; p5abI++){ P5_AB_FIELDS.push('p5abNama'+p5abI,'p5abFreq'+p5abI,'p5abDosis'+p5abI); }
// Field yang BISA diubah saat membuat laporan baru.
var P5_NEW_EDIT = ['p5pj','p5pp','p5bed','p5diagnosis','p5laporan'].concat(P5_PPI_FIELDS,P5_AB_FIELDS);
// Field non-checkbox yang tetap bisa diedit saat memperbarui laporan lama (p5Perbarui).
var P5_EDIT_EXTRA = ['p5bed','p5diagnosis','p5laporan'].concat(P5_PPI_FIELDS,P5_AB_FIELDS);
// Semua kelas checkbox yang ikut ditulis ke kolom I (alat medik + DPJP visit + PPI)
// -- dipakai bersama utk reset/kunci/kumpul.
var P5_CB_SEL = '.multi,.dpjp14,.ppi';
var P5_CB_SEL_CHECKED = '.multi:checked,.dpjp14:checked,.ppi:checked';

// ── Auto-cek Alat Medik dari kata di Isi Laporan ──
// Sumber daftar+override sama dgn Page3 (checklistDefsJson, lihat code.gs).
var P5_DEFS = <?!= checklistDefsJson() ?>;
// Default: kata pemicu = label checkbox-nya sendiri, spasi/strip antar kata jadi opsional
// (mis. "iv line"/"iv-line"/"ivline" semua kena). Override (TPM/PPM dkk) sudah regex jadi.
function p5BuildDefaultAlatRegex(label){
  var esc = String(label).replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/[\s-]+/g,'[\\s-]?');
  return new RegExp('\\b'+esc+'\\b','i');
}
var P5_ALAT_TRIGGERS = {};
P5_DEFS.alat.forEach(function(a){
  var ov = P5_DEFS.triggerOverrides && P5_DEFS.triggerOverrides[a.id];
  P5_ALAT_TRIGGERS[a.id] = ov ? ov.map(function(src){return new RegExp(src,'i');}) : [p5BuildDefaultAlatRegex(a.label)];
});
// Flag "sudah pernah terpicu" per item alat -- sekali terpicu, ketikan berikutnya tidak
// memaksa cek ulang walau kata pemicu masih/kembali ada (supaya uncheck manual dihormati).
var p5AlatFired = {};
// Reset flag berdasar teks BASELINE (isi laporan saat form dibuka) -- kata yang SUDAH ada
// sejak awal dianggap "sudah terpicu" juga, supaya tidak auto-cek ulang saat teks lain diketik.
function p5ResetAlatFired(baselineText){
  var fired = {};
  Object.keys(P5_ALAT_TRIGGERS).forEach(function(id){
    fired[id] = P5_ALAT_TRIGGERS[id].some(function(re){ return re.test(baselineText||''); });
  });
  return fired;
}
function p5HandleAlatInput(text){
  Object.keys(P5_ALAT_TRIGGERS).forEach(function(id){
    if(p5AlatFired[id]) return;
    var hit = P5_ALAT_TRIGGERS[id].some(function(re){ return re.test(text); });
    if(!hit) return;
    p5AlatFired[id] = true;
    var cb = document.getElementById(id);
    if(cb && !cb.checked) cb.checked = true;
  });
}

// Sanitasi nilai bebas sebelum digabung ke string kolom I (';' adalah pemisah token utama).
function p5PpiEsc(s){ return String(s||'').replace(/;/g,','); }

// Urai token 'Key=Value' dari string kolom I mentah -> {Key:Value}. Token tanpa
// '=' (checkbox alat medik/PPI/DPJP) diabaikan di sini -- itu ditangani terpisah
// oleh restore checkbox berbasis id (id===value, lihat catatan htmlCheckbox()).
function p5ParseKV(raw){
 var kv={};
 String(raw||'').split(';').forEach(function(tok){
   var i=tok.indexOf('=');
   if(i>=0) kv[tok.substring(0,i).trim()]=tok.substring(i+1);
 });
 return kv;
}

// Isi field PPI singkat (Tindakan/Kultur/Suhu) dari string kolom I mentah, dgn
// default yang sama seperti saat ditulis (lihat p5Kumpul) bila token tak ada.
function p5ApplyPpiFields(raw){
 var kv=p5ParseKV(raw);
 document.getElementById('p5ppiTindakan').value=kv.TindakanOperasi!==undefined?kv.TindakanOperasi:'';
 document.getElementById('p5ppiKultur').value=kv.HasilKultur!==undefined?kv.HasilKultur:'0';
 document.getElementById('p5ppiSuhu').value=kv.Suhu!==undefined?kv.Suhu:'36';
}

// Isi 5 slot antibiotik dari string kolom I mentah. Proses ATOMIK per slot
// (nama+freq+dosis sekaligus dari token slot yang sama) supaya freq/dosis tidak
// nyasar tertukar antar slot. Slot tanpa token Nama dikosongkan.
function p5ApplyAntibiotik(raw){
 var kv=p5ParseKV(raw);
 for(var i=1;i<=5;i++){
   var nama=kv['Antibiotik'+i+'Nama'];
   document.getElementById('p5abNama'+i).value =nama!==undefined?nama:'';
   document.getElementById('p5abFreq'+i).value =nama!==undefined?(kv['Antibiotik'+i+'Freq']||''):'';
   document.getElementById('p5abDosis'+i).value=nama!==undefined?(kv['Antibiotik'+i+'Berat']||''):'';
 }
}

function initP5(params){
 if(!p5Ready){
   document.getElementById('p5cari').addEventListener('click',p5BukaFromControls);
   document.getElementById('p5tambahdata').addEventListener('click',p5BukaFromControls);
   document.getElementById('p5simpan').addEventListener('click',p5Simpan);
   document.getElementById('p5update').addEventListener('click',p5Perbarui);
   // Ganti tanggal → reset nama & ambil daftar nama tanggal itu (1 call)
   document.getElementById('p5fTgl').addEventListener('change',function(){
     document.getElementById('p5fNama').value='';
     p5Open('', this.value, document.getElementById('p5fShift').value);
   });
   // Ganti nama / shift → muat paket (1 call). bed/diagnosis/alat ikut shift sebelumnya.
   document.getElementById('p5fNama').addEventListener('change',p5BukaFromControls);
   document.getElementById('p5fShift').addEventListener('change',p5BukaFromControls);
   // Ketik nama alat medik di Isi Laporan -> auto-cek checkbox terkait (lihat P5_ALAT_TRIGGERS).
   document.getElementById('p5laporan').addEventListener('input',function(){
     p5HandleAlatInput(this.value);
   });
   p5Ready=true;
 }
 p5ApplyMaxTgl();

 if(params && params.viewNomor){
   p5SetSearchDefaults();
   p5LoadByNomor(params.viewNomor);
 }else if(params && params.isNew){
   var tgl=params.hariIni||p5OpsTgl();
   document.getElementById('p5fTgl').value=tgl;
   document.getElementById('p5fShift').value=params.shift||'Pagi';
   p5Open(params.namaPasien||'', tgl, params.shift||'Pagi');   // SATU call
 }else{
   p5SetSearchDefaults();
   p5Open('', document.getElementById('p5fTgl').value, document.getElementById('p5fShift').value);
 }
 p5WizUpdateBadge(); // tampilkan/sembunyikan badge sesuai window.WIZ saat ini
}

function p5SetSearchDefaults(){
 var t=document.getElementById('p5fTgl'); if(!t.value)t.value=p5OpsTgl();
 var s=document.getElementById('p5fShift'); if(!s.value)s.value='Pagi';
}

// ── Mode berurutan (wizard) — lihat window.WIZ, di-set dari mulaiWizard() Page1.
// Goretty TIDAK perlu peta savedNomor terpisah (beda dari Damianus): p5Open() di
// bawah selalu cek ulang ke server (getPaketLaporan) tiap pindah pasien, jadi
// laporan yang sudah tersimpan otomatis kebuka di mode lihat, bukan dobel.
function p5WizUpdateBadge(){
 var el=document.getElementById('p5wiz');
 if(!el) return;
 var w=window.WIZ, aktif=!!(w && w.active);
 // Kunci bilah pencarian/+ Laporan Baru selama wizard aktif -- mencegah user pindah
 // konteks di tengah alur (bisa bikin p5WizAdvance() salah sasaran).
 ['p5fTgl','p5fNama','p5fShift','p5cari','p5tambahdata'].forEach(function(id){
   var e=document.getElementById(id); if(e) e.disabled=aktif;
 });
 if(aktif){
   el.classList.add('show');
   document.getElementById('p5wiz-info').textContent=
     'Mode berurutan · Shift '+w.shift+' · pasien '+(w.pos+1)+' dari '+w.all.length;
   var prevBtn=document.getElementById('p5wiz-prev'), nextBtn=document.getElementById('p5wiz-next');
   if(prevBtn) prevBtn.disabled=(w.pos<=0);
   if(nextBtn) nextBtn.disabled=(w.pos>=w.all.length-1);
 }else{
   el.classList.remove('show');
 }
}
function p5WizKeluar(){
 if(window.WIZ) window.WIZ.active=false;
 p5WizUpdateBadge();
 toast('Keluar dari mode berurutan.','ok');
}
function p5WizGoto(pos){
 var w=window.WIZ;
 if(!w || !w.active) return;
 if(pos<0 || pos>=w.all.length) return;
 w.pos=pos;
 p5WizUpdateBadge();
 document.getElementById('p5fNama').value=w.all[pos];
 p5Open(w.all[pos], w.hariIni, w.shift);
}
function p5WizPrev(){
 if(window.WIZ) p5WizGoto(window.WIZ.pos-1);
}
// Lewati pasien saat ini TANPA menyimpan — pindah ke pasien berikutnya.
function p5WizSkip(){
 var w=window.WIZ;
 if(!w || !w.active) return;
 if(w.pos>=w.all.length-1){ toast('Sudah di pasien terakhir dalam daftar.','ok'); return; }
 p5WizGoto(w.pos+1);
}
// Dipanggil setelah simpandisheet sukses (laporan baru) ATAU saat duplikat
// terdeteksi selagi wizard aktif. Lanjut ke pasien berikutnya, atau tutup wizard
// & kembali ke Page1 kalau yang baru disimpan adalah pasien terakhir dalam daftar.
function p5WizAdvance(){
 var w=window.WIZ;
 if(!w || !w.active) return false;
 if(w.pos>=w.all.length-1){
   w.active=false;
   toast('Mode berurutan selesai — semua laporan shift '+w.shift+' sudah dibuat.','ok');
   gotoPage('p1');
   return true;
 }
 p5WizGoto(w.pos+1);
 return true;
}

// Tanggal operasional (hari berganti pukul 07:00): default & batas atas laporan baru.
// Sumber server (var global OPS_TGL); fallback tanggal kalender browser.
function p5OpsTgl(){return (typeof opsTgl==='function')?opsTgl():ymd(new Date());}
function p5ApplyMaxTgl(){
 var ot=p5OpsTgl();
 var t=document.getElementById('p5fTgl');   if(t)t.max=ot;
 var t2=document.getElementById('p5tanggal'); if(t2)t2.max=ot;
}

// Batas jam dinas (mirror UX dari server; SAMAKAN dgn SHIFT_MULAI_JAM di code.gs).
// Laporan (tanggal D, shift S) baru boleh dibuat setelah jam mulai S pada hari D.
// Validasi otoritatif tetap di server (`simpandisheet` → alasan 'shift_belum').
var P5_SHIFT_MULAI_JAM={'Pagi':7,'Sore':14,'Malam':20};
function p5HariEfektifShift(shift){
 var jam=P5_SHIFT_MULAI_JAM[shift]; if(jam===undefined)jam=7;
 var d=new Date(new Date().getTime()-jam*3600*1000);
 return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
}
function p5JamMulai(shift){
 var jam=P5_SHIFT_MULAI_JAM[shift]; if(jam===undefined)jam=7;
 return ('0'+jam).slice(-2)+':00';
}

function p5BukaFromControls(){
 p5Open(document.getElementById('p5fNama').value,
        document.getElementById('p5fTgl').value,
        document.getElementById('p5fShift').value);
}

// ── Inti: SATU panggilan server → daftar nama + data pasien + shift sebelumnya + existing ──
function p5Open(nama, tgl, shift){
 if(!tgl||!shift){p5KosongkanTampilan('Lengkapi tanggal & shift.');return;}
 loading(true);
 google.script.run
   .withSuccessHandler(function(raw){
     loading(false);
     var pkt;try{pkt=JSON.parse(raw);}catch(e){pkt=null;}
     if(!pkt){p5KosongkanTampilan('Gagal memuat data.');return;}
     p5FillNamaDropdown(pkt.namaList, nama);
     if(!nama){p5KosongkanTampilan('Pilih nama pasien.');return;}
     if(pkt.existing){
       p5Render(pkt.existing);                                  // laporan sudah ada → mode lihat
     }else if(String(tgl).substring(0,10) > p5HariEfektifShift(shift)){
       // Jam dinas shift ini belum dimulai — laporan baru belum boleh dibuat.
       // (Batas bawah saja; menulis setelah shift lewat tetap boleh.)
       p5KosongkanTampilan('Belum waktunya dinas '+shift+' tanggal '+fmtDMY(tgl)+'. '
         +'Laporan baru bisa dibuat mulai pukul '+p5JamMulai(shift)+'.');
       toast('Belum waktunya dinas '+shift+' — mulai pukul '+p5JamMulai(shift)+'.','err');
     }else{
       p5SetupBaru(nama, tgl, shift, pkt.dataPasien, pkt.sebelumnya); // baru, terisi shift sebelumnya
     }
   })
   .withFailureHandler(function(e){loading(false);errH(e);})
   .getPaketLaporan(nama, tgl, shift);
}

function p5FillNamaDropdown(list, selected){
 var sel=document.getElementById('p5fNama');
 sel.innerHTML='<option value="">— pilih —</option>';
 (list||[]).forEach(function(n){
   var o=document.createElement('option');o.value=n;o.textContent=n;sel.appendChild(o);
 });
 if(selected){
   var found=false;
   for(var i=0;i<sel.options.length;i++){if(sel.options[i].value===selected){found=true;break;}}
   if(!found){var o=document.createElement('option');o.value=selected;o.textContent=selected;sel.appendChild(o);}
   sel.value=selected;
 }
}

function p5EnsureNamaOption(nama){
 if(!nama)return;
 var sel=document.getElementById('p5fNama');
 for(var i=0;i<sel.options.length;i++){if(sel.options[i].value===nama){sel.value=nama;return;}}
 var o=document.createElement('option');o.value=nama;o.textContent=nama;sel.appendChild(o);sel.value=nama;
}

function p5LoadByNomor(nomor){
 loading(true);
 google.script.run
   .withSuccessHandler(function(raw){
     loading(false);
     if(!raw||raw===''){p5KosongkanTampilan('Data tidak ditemukan.');return;}
     try{p5Render(JSON.parse(raw));}catch(e){toast('Error render: '+e.message,'err');}
   })
   .withFailureHandler(function(e){loading(false);errH(e);})
   .caridata(nomor);
}

function p5Render(baris){
 var r=(Array.isArray(baris)&&baris.length>0&&Array.isArray(baris[0]))?baris[0]:baris;
 if(!r||!r.length){p5KosongkanTampilan('Data kosong.');return;}
 p5Nama=String(r[4]||'');
 var ids={p5nomor:r[0],p5dinas:r[2],p5pj:r[3],p5namahidden:r[4],
   p5pasien:r[4],p5pp:r[5],p5diagnosis:r[6],p5laporan:r[7],
   p5agama:r[10],p5jaminan:r[11],p5dpjp:r[12],p5dpjplain:r[13],
   p5umur:r[14],p5harike:r[15],p5bed:r[16]};
 Object.keys(ids).forEach(function(id){
   var el=document.getElementById(id);
   if(el)el.value=(ids[id]===null||ids[id]===undefined)?'':String(ids[id]);
 });
 var tgEl=document.getElementById('p5tanggal');
 if(tgEl){
   if(r[1]){try{var d=new Date(r[1]);
     tgEl.value=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
   }catch(e){tgEl.value='';}}else{tgEl.value='';}
 }
 document.querySelectorAll(P5_CB_SEL).forEach(function(cb){cb.checked=false;});
 if(r[8]&&String(r[8]).length>0){
   String(r[8]).split(';').forEach(function(id){
     var el=document.getElementById(String(id).trim());if(el)el.checked=true;
   });
 }
 p5ApplyPpiFields(r[8]);
 p5ApplyAntibiotik(r[8]);
 p5AlatFired=p5ResetAlatFired(String(r[7]||''));
 if(r[1]&&tgEl)document.getElementById('p5fTgl').value=tgEl.value;
 document.getElementById('p5fShift').value=String(r[2]||'')||'Pagi';
 p5EnsureNamaOption(String(r[4]||''));
 p5Kunci();
}

// Mode LIHAT
function p5Kunci(){
 P5_LOCK.concat(P5_NEW_EDIT).forEach(function(id){var el=document.getElementById(id);if(el)el.disabled=true;});
 document.querySelectorAll(P5_CB_SEL).forEach(function(cb){cb.disabled=true;});
 document.getElementById('p5pasien').hidden=true;
 document.getElementById('p5namahidden').hidden=false;
 if(p5Nama&&!document.getElementById('p5namahidden').value)
   document.getElementById('p5namahidden').value=p5Nama;
 document.getElementById('p5simpan').hidden=true;
 document.getElementById('p5update').hidden=false;
 p5ReqShow(false);
 p5SetHint('Mode lihat — klik Perbarui untuk mengedit');
 p5Edit=false;p5Mode='lihat';
}

// Mode EDIT laporan yang sudah ada (identitas tetap terkunci)
function p5Perbarui(){
 P5_LOCK.forEach(function(id){var el=document.getElementById(id);if(el)el.disabled=true;});
 P5_EDIT_EXTRA.forEach(function(id){document.getElementById(id).disabled=false;});
 document.querySelectorAll(P5_CB_SEL).forEach(function(cb){cb.disabled=false;});
 document.getElementById('p5simpan').hidden=false;
 document.getElementById('p5update').hidden=true;
 p5ReqShow(false);
 p5SetHint('Mode edit — ubah data lalu klik Simpan');
 p5Edit=true;p5Mode='edit';
}

// Setup laporan BARU: identitas dikunci; bed/diagnosis/alat diisi dari shift sebelumnya.
function p5SetupBaru(nama,tgl,shift,dataPasien,sebelumnya){
 p5Bersih();
 p5Mode='baru';p5Edit=true;p5Nama=nama;
 document.getElementById('p5nomor').value='';
 document.getElementById('p5namahidden').value=nama;
 document.getElementById('p5namahidden').hidden=false;
 document.getElementById('p5pasien').hidden=true;
 document.getElementById('p5tanggal').value=tgl;
 document.getElementById('p5dinas').value=shift;
 if(dataPasien){
   var p=dataPasien;
   var map={p5umur:p[14],p5harike:p[15],p5agama:p[6],
            p5jaminan:p[8],p5dpjp:p[12],p5dpjplain:p[13],p5bed:p[11]};
   Object.keys(map).forEach(function(id){var el=document.getElementById(id);if(el)el.value=p5Fv(map[id]);});
 }
 // Shift sebelumnya: bed (timpa bed dari ws2), diagnosis, alat medik
 var sb=sebelumnya||{};
 if(sb.bed)document.getElementById('p5bed').value=sb.bed;
 if(sb.diagnosis)document.getElementById('p5diagnosis').value=sb.diagnosis;
 document.querySelectorAll(P5_CB_SEL).forEach(function(cb){cb.checked=false;});
 if(sb.alatmedik){
   // Semua alat medik diwariskan dari shift sebelumnya, KECUALI AGD -- itu tes darah
   // sesaat, harus diketik ulang kata "AGD" tiap shift kalau masih relevan
   // (lihat p5HandleAlatInput; Isi Laporan sendiri selalu mulai kosong tiap shift baru).
   String(sb.alatmedik).split(';').forEach(function(id){
     id=String(id).trim();
     if(id==='AGD') return;
     var cb=document.getElementById(id);if(cb)cb.checked=true;
   });
 }
 p5ApplyPpiFields(sb.alatmedik);
 p5ApplyAntibiotik(sb.alatmedik);
 // (p5AlatFired sudah direset ke baseline kosong oleh p5Bersih() di atas -- Isi
 // Laporan tidak ikut diwariskan dari shift sebelumnya.)
 // Kunci identitas, buka field yang boleh diisi
 P5_LOCK.forEach(function(id){var el=document.getElementById(id);if(el)el.disabled=true;});
 P5_NEW_EDIT.forEach(function(id){var el=document.getElementById(id);if(el)el.disabled=false;});
 document.querySelectorAll(P5_CB_SEL).forEach(function(cb){cb.disabled=false;});
 document.getElementById('p5simpan').hidden=false;
 document.getElementById('p5update').hidden=true;
 p5ReqShow(true);
 p5SetHint('Mode input baru — bed/diagnosis/alat mengikuti shift sebelumnya. Lengkapi PJ/PP lalu Simpan.');
}

function p5Simpan(){
 var ui=p5Kumpul();
 var wajib=ui.tanggal&&ui.dinas&&ui.pj&&ui.pp&&ui.pasien;
 if(!wajib || (p5Mode!=='baru' && !ui.nomor)){
   toast('Ada data wajib yang belum diisi.','err');return;
 }
 ui.isBaru=(p5Mode==='baru');
 p5Nama=ui.pasien;
 var btn=document.getElementById('p5simpan');
 btn.disabled=true;loading(true);
 google.script.run
   .withSuccessHandler(function(raw){
     loading(false);btn.disabled=false;
     var res;try{res=JSON.parse(raw);}catch(e){res=null;}
     if(!res||!res.ok){
       if(res&&res.alasan==='duplikat'){
         // Wizard aktif: pasien ini rupanya sudah dilaporkan (mis. staf lain) —
         // lewati saja, jangan hentikan alur dengan banner error.
         if(ui.isBaru && window.WIZ && window.WIZ.active){
           toast('Pasien ini sudah ada laporannya (No. '+res.nomor+') — dilewati.','ok');
           p5WizAdvance();
           return;
         }
         toast('Laporan untuk pasien+tanggal+shift ini sudah ada (No. '+res.nomor+'). Membuka laporan tersebut…','err');
         p5LoadByNomor(res.nomor);
       }else if(res&&res.alasan==='shift_belum'){
         toast('Belum waktunya dinas '+(res.shift||'')+' — laporan baru bisa dibuat mulai pukul '
           +p5JamMulai(res.shift)+'.','err');
       }else if(res&&res.alasan==='tidak_ditemukan'){
         toast('Laporan tidak ditemukan untuk diedit.','err');
       }else if(res&&res.alasan==='sibuk'){
         toast('Server sibuk, coba simpan lagi sebentar.','err');
       }else{
         toast('Gagal menyimpan data.','err');
       }
       return;
     }
     document.getElementById('p5nomor').value=res.nomor;
     p5Kunci();
     var nhEl=document.getElementById('p5namahidden');
     if(nhEl&&p5Nama)nhEl.value=p5Nama;
     toast('Data berhasil disimpan (No. '+res.nomor+').','ok');
     loaded.p1=false;
     try{localStorage.setItem('ldd_dataChanged',String(Date.now()));}catch(e){}
     if(ui.isBaru && window.WIZ && window.WIZ.active) p5WizAdvance();
   })
   .withFailureHandler(function(e){loading(false);btn.disabled=false;errH(e);})
   .simpandisheet(ui);
}

function p5Kumpul(){
 var ui={};
 ui.pasien=document.getElementById('p5namahidden').value||p5Nama;
 ui.nomor=parseInt(document.getElementById('p5nomor').value)||0;
 ui.tanggal=document.getElementById('p5tanggal').value;
 ui.dinas=document.getElementById('p5dinas').value;
 ui.pj=document.getElementById('p5pj').value;
 ui.pp=document.getElementById('p5pp').value;
 ui.diagnosis=document.getElementById('p5diagnosis').value;
 ui.laporan=document.getElementById('p5laporan').value;
 ui.agama=document.getElementById('p5agama').value;
 ui.jaminan=document.getElementById('p5jaminan').value;
 ui.dpjp=document.getElementById('p5dpjp').value;
 ui.dpjplain=document.getElementById('p5dpjplain').value;
 ui.umur=document.getElementById('p5umur').value;
 ui.harike=document.getElementById('p5harike').value;
 ui.bed=document.getElementById('p5bed').value;
 var tokens=Array.from(document.querySelectorAll(P5_CB_SEL_CHECKED)).map(function(e){return e.value;});
 // Isian PPI singkat SELALU ditulis (walau kosong/default) supaya parsing baliknya konsisten.
 tokens.push('TindakanOperasi='+p5PpiEsc(document.getElementById('p5ppiTindakan').value));
 tokens.push('HasilKultur='+p5PpiEsc(document.getElementById('p5ppiKultur').value||'0'));
 tokens.push('Suhu='+p5PpiEsc(document.getElementById('p5ppiSuhu').value||'36'));
 // Antibiotik: slot tanpa Nama TIDAK ditulis sama sekali (kolom I tak membengkak percuma).
 for(var abI=1;abI<=5;abI++){
   var abNama=document.getElementById('p5abNama'+abI).value;
   if(!abNama) continue;
   tokens.push('Antibiotik'+abI+'Nama='+p5PpiEsc(abNama));
   tokens.push('Antibiotik'+abI+'Freq='+p5PpiEsc(document.getElementById('p5abFreq'+abI).value));
   tokens.push('Antibiotik'+abI+'Berat='+p5PpiEsc(document.getElementById('p5abDosis'+abI).value));
 }
 ui.alatmedik=tokens.join(';');
 return ui;
}

function p5Bersih(){
 ['p5nomor','p5tanggal','p5umur','p5harike','p5agama','p5jaminan',
  'p5dpjp','p5dpjplain','p5laporan','p5diagnosis','p5namahidden'].forEach(function(id){
   var el=document.getElementById(id);if(el)el.value='';
 });
 ['p5dinas','p5pj','p5pp','p5pasien','p5bed'].forEach(function(id){
   var el=document.getElementById(id);if(el)el.value='';
 });
 document.querySelectorAll(P5_CB_SEL).forEach(function(cb){cb.checked=false;});
 p5ApplyPpiFields('');
 p5ApplyAntibiotik('');
 p5AlatFired=p5ResetAlatFired('');
}

function p5KosongkanTampilan(hint){
 p5Bersih();
 P5_LOCK.concat(P5_NEW_EDIT).forEach(function(id){var el=document.getElementById(id);if(el)el.disabled=true;});
 document.querySelectorAll(P5_CB_SEL).forEach(function(cb){cb.disabled=true;});
 document.getElementById('p5simpan').hidden=true;
 document.getElementById('p5update').hidden=true;
 p5ReqShow(false);
 p5Edit=false;p5Mode='lihat';
 p5SetHint(hint||'');
}

function p5Fv(v){
 if(v instanceof Date)return v.getFullYear()+'-'+('0'+(v.getMonth()+1)).slice(-2)+'-'+('0'+v.getDate()).slice(-2);
 return String(v===null||v===undefined?'':v);
}
function p5ReqShow(v){
 document.querySelectorAll('.req').forEach(function(e){e.style.display=v?'inline':'none';});
}
function p5SetHint(t){var e=document.getElementById('p5hint');if(e)e.textContent=t;}
</script>
