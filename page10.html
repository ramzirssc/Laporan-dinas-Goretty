<!-- PAGE 10: JADWAL DINAS (iframe read-only aplikasi eksternal) -->
<!-- Aplikasi eksternal di-deploy ALLOWALL + akses "Anyone" → boleh di-embed.
     Iframe di-set lazy (src baru diisi saat tab pertama kali dibuka) supaya
     tak membebani load awal SPA. Read-only: hanya lihat/scroll; halaman
     default aplikasi sumber hanya menampilkan jadwal (form ajukan terpisah). -->
<style>
  .p10-wrap{display:flex;flex-direction:column;
    height:calc(100vh - var(--topbar-h) - 28px)}
  .p10-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;
    padding:6px 10px;background:#eef3f8;border:1px solid #d7e0ea;
    border-bottom:none;border-radius:var(--radius-sm) var(--radius-sm) 0 0;
    font-size:12px;color:var(--muted)}
  .p10-bar .lbl{font-weight:700;color:var(--blue-dk)}
  .p10-bar a{color:#1e3f62;font-weight:700;text-decoration:none}
  .p10-bar a:hover{text-decoration:underline}
  .p10-frame{flex:1;width:100%;border:1px solid #d7e0ea;
    border-radius:0 0 var(--radius-sm) var(--radius-sm);background:#fff}
</style>

<div class="p10-wrap">
  <div class="p10-bar">
    <span class="lbl">🗓️ Jadwal Dinas</span>
    <span>tampilan baca saja</span>
    <span style="margin-left:auto">Tidak muncul?
      <a id="p10-open-link"
         href="https://script.google.com/macros/s/AKfycbyia5srJF2bU_ilLuGuoVgLOG1a4cew6BR_54El4ehZ0Pmly-kImnrUkxK72B-WmQrGfQ/exec"
         target="_blank" rel="noopener">buka di tab baru ↗</a></span>
  </div>
  <iframe class="p10-frame" id="p10-frame"
          title="Jadwal Dinas" referrerpolicy="no-referrer"></iframe>
</div>

<script>
var P10_URL='https://script.google.com/macros/s/AKfycbyia5srJF2bU_ilLuGuoVgLOG1a4cew6BR_54El4ehZ0Pmly-kImnrUkxK72B-WmQrGfQ/exec';

function initP10(){
  // Isi src sekali saja saat tab pertama dibuka (lazy load).
  var f=document.getElementById('p10-frame');
  if(f && !f.src) f.src=P10_URL;
}
</script>
