<!-- PAGE 7: PERMINTAAN DINAS — form ajukan + batalkan (native) + tabel jawaban -->
<style>
  .p7-layout{display:grid;grid-template-columns:1fr 2fr;gap:12px;
    height:calc(100vh - var(--topbar-h) - 28px)}
  .p7-form-panel{display:flex;flex-direction:column;height:100%;
    background:var(--surface);border:1px solid var(--border-soft);
    border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden}
  .p7-panel-title{padding:9px 13px;background:#1e3f62;color:#fff;
    font-family:var(--serif);font-size:13px;font-style:italic;font-weight:600;flex-shrink:0}
  .p7-fscroll{flex:1;overflow-y:auto;padding:12px 13px}
  .p7-form{display:flex;flex-direction:column;gap:9px}
  .p7-row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .ff7{display:flex;flex-direction:column;gap:3px}
  .ff7 label{font-size:10px;font-weight:700;text-transform:uppercase;
    letter-spacing:.08em;color:var(--muted)}
  .ff7 input,.ff7 select,.ff7 textarea{padding:8px;font-size:12px;border:1px solid var(--border);
    border-radius:var(--radius-sm);background:var(--field-active-bg);
    color:var(--field-active-text);width:100%;font-family:inherit}
  .ff7 input[type=date]{height:36px;-webkit-appearance:none;appearance:none}
  .ff7 input:focus,.ff7 select:focus,.ff7 textarea:focus{outline:none;
    border-color:var(--blue-focus);box-shadow:0 0 0 3px var(--blue-lt)}
  .p7-sub{font-family:var(--serif);font-size:12.5px;font-style:italic;
    font-weight:600;color:#1e3f62;margin:2px 0}
  .p7-sep{height:1px;background:var(--border-soft);margin:14px 0 10px}
  .p7-msg{font-size:11.5px;padding:6px 8px;border-radius:var(--radius-sm);display:none}
  .p7-msg.ok {display:block;background:var(--ok-lt);color:var(--ok);border:1px solid var(--ok)}
  .p7-msg.err{display:block;background:var(--warn-lt);color:var(--warn);border:1px solid var(--warn)}
  .p7-clist{margin-top:8px;font-size:11.5px}
  .p7-crow{display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:6px 0;border-bottom:1px solid var(--border-soft)}
  .p7-crow .info{flex:1;line-height:1.35}
  .p7-crow .info small{color:var(--muted)}
  /* Tabel kanan */
  .p7-tbl-panel{display:flex;flex-direction:column;overflow:hidden}
  .p7-filter{background:var(--surface);border:1px solid var(--border-soft);
    border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:10px 13px;border-bottom:none;
    display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap;flex-shrink:0}
  .p7-filter input{height:36px;padding:0 8px;font-size:12px;border:1px solid var(--border);
    border-radius:var(--radius-sm);background:var(--field-active-bg);
    color:var(--field-active-text);-webkit-appearance:none;appearance:none}
  .p7-cnt{font-size:11.5px;color:var(--muted);font-style:italic;padding:4px 13px;
    background:var(--surface2);border:1px solid var(--border-soft);
    border-top:none;border-bottom:none;flex-shrink:0}
  .p7-scroll{flex:1;overflow-y:auto;overflow-x:auto;background:var(--surface);
    border:1px solid var(--border-soft);border-top:none;
    border-radius:0 0 var(--radius-lg) var(--radius-lg);box-shadow:var(--shadow)}
  .p7-tbl{width:100%;border-collapse:collapse;font-size:11.5px;min-width:640px}
  .p7-tbl thead{position:sticky;top:0;z-index:10}
  .p7-tbl thead tr th{background:#1e3f62;color:#fff;padding:8px 9px;font-size:10px;
    font-weight:700;text-transform:uppercase;letter-spacing:.04em;text-align:left;
    white-space:nowrap;border-right:1px solid rgba(255,255,255,.1)}
  .p7-tbl thead tr th:last-child{border-right:none}
  .p7-tbl tbody tr{border-bottom:1px solid var(--border-soft);background:var(--surface)}
  .p7-tbl tbody tr:hover{background:var(--blue-lt)}
  .p7-tbl tbody td{padding:7px 9px;vertical-align:top;font-size:11.5px;word-wrap:break-word;
    white-space:normal;line-height:1.4;border-right:1px solid var(--border-soft)}
  .p7-tbl tbody td:last-child{border-right:none}
  .p7-tbl tbody td.nm{color:var(--muted);font-size:11px}
  .j-ok {display:inline-block;padding:2px 7px;border-radius:9px;font-size:10.5px;font-weight:700;background:var(--ok-lt);color:var(--ok);border:1px solid var(--ok)}
  .j-no {display:inline-block;padding:2px 7px;border-radius:9px;font-size:10.5px;font-weight:700;background:var(--warn-lt);color:var(--warn);border:1px solid var(--warn)}
  .j-btl{display:inline-block;padding:2px 7px;border-radius:9px;font-size:10.5px;font-weight:700;background:#fff0e8;color:#7a2800;border:1px solid #c94a14}
  .j-pnd{display:inline-block;padding:2px 7px;border-radius:9px;font-size:10.5px;font-weight:700;background:#fff7e6;color:#7a4e00;border:1px solid #e09500}
  .p7-loader{text-align:center;padding:24px;color:var(--muted);font-size:12px}
  .p7-err  {text-align:center;padding:24px;color:var(--warn);font-size:12px}
  .p7-empty{text-align:center;padding:32px;color:var(--muted);font-size:12px}
  @media(max-width:900px){
    .p7-layout{grid-template-columns:1fr;height:auto;gap:12px}
    .p7-form-panel{height:auto}
    .p7-tbl-panel{min-height:360px}
  }
</style>

<div class="p7-layout">
  <!-- KIRI: form ajukan + batalkan -->
  <div class="p7-form-panel">
    <div class="p7-panel-title">📋 Form Permintaan Dinas</div>
    <div class="p7-fscroll">
      <form id="p7f" class="p7-form" onsubmit="return p7Submit(event)">
        <div class="ff7"><label>Nama Staf *</label><select id="p7-nama" required></select></div>
        <div class="ff7"><label>Jenis Permintaan *</label><select id="p7-jenis" required></select></div>
        <div class="p7-row2">
          <div class="ff7"><label>Tgl Mulai *</label><input type="date" id="p7-tm" required onchange="p7TmChange()"></div>
          <div class="ff7"><label>Tgl Selesai *</label><input type="date" id="p7-ts" required></div>
        </div>
        <div class="ff7"><label>Alasan</label><textarea id="p7-alasan" rows="2" placeholder="Alasan permintaan…"></textarea></div>
        <button type="submit" class="btn btn-primary" id="p7-submit" style="width:100%">Kirim Permintaan</button>
        <div class="p7-msg" id="p7-msg"></div>
      </form>

      <div class="p7-sep"></div>

      <div class="p7-sub">🗑️ Batalkan Permintaan Saya</div>
      <div style="display:flex;gap:6px;align-items:flex-end">
        <div class="ff7" style="flex:1"><label>Nama Staf</label><select id="p7-cnama"></select></div>
        <button type="button" class="btn btn-ghost" onclick="p7CancelShow()" style="height:37px;font-size:12px">Tampilkan</button>
      </div>
      <div class="p7-clist" id="p7-clist"><span style="color:var(--muted)">Pilih nama lalu klik Tampilkan.</span></div>
    </div>
  </div>

  <!-- KANAN: tabel jawaban (read-only) -->
  <div class="p7-tbl-panel">
    <div class="p7-filter">
      <div class="ff7"><label>Tgl Mulai ≥</label><input type="date" id="p7-dari" style="width:128px"></div>
      <div class="ff7" style="justify-content:flex-end;padding-bottom:8px"><span style="font-size:11px;color:var(--muted)">s/d</span></div>
      <div class="ff7"><label>Tgl Mulai ≤</label><input type="date" id="p7-sampai" style="width:128px"></div>
      <div class="ff7"><label>Nama</label><input type="text" id="p7-fnama" placeholder="Ketik nama…" style="width:150px" oninput="p7RenderFilter()"></div>
      <div style="display:flex;gap:6px;align-items:flex-end">
        <button class="btn btn-primary" onclick="p7Cari()" style="height:36px;font-size:12px">🔍 Cari</button>
        <button class="btn btn-ghost"   onclick="p7Reset()" style="height:36px;font-size:12px">Reset</button>
      </div>
    </div>
    <div class="p7-cnt" id="p7-cnt">Memuat…</div>
    <div class="p7-scroll">
      <div class="p7-loader" id="p7-loader">Memuat data…</div>
      <table class="p7-tbl" id="p7-tbl" style="display:none">
        <thead><tr>
          <th style="width:32px">No.</th><th style="width:95px">Timestamp</th>
          <th style="width:190px">Nama</th><th style="width:80px">Tgl Mulai</th>
          <th style="width:80px">Tgl Selesai</th><th style="width:95px">Jenis</th>
          <th style="width:78px">Jawaban</th><th>Alasan Ditolak</th>
        </tr></thead>
        <tbody id="p7-tbody"></tbody>
      </table>
      <div class="p7-empty" id="p7-empty" style="display:none">📭 Tidak ada data</div>
      <div class="p7-err"   id="p7-err"   style="display:none"></div>
    </div>
  </div>
</div>

<script>
var P7_JENIS=['Dinas pagi','Dinas sore','Dinas malam','Turun malam','Libur Mingguan','Libur Bayar (karena double shift)','Cuti Khusus','Cuti Tahunan','Cuti Panjang'];
var P7_ROWS=[], P7_CANCEL_NAME='';

function initP7(){
  document.getElementById('p7-jenis').innerHTML='<option value="">— pilih —</option>'+P7_JENIS.map(function(o){return '<option>'+esc(o)+'</option>';}).join('');
  google.script.run.withSuccessHandler(function(raw){
    var list=[]; try{list=JSON.parse(raw);}catch(e){}
    var opt='<option value="">— pilih nama —</option>'+list.map(function(n){return '<option>'+esc(n)+'</option>';}).join('');
    document.getElementById('p7-nama').innerHTML=opt;
    document.getElementById('p7-cnama').innerHTML=opt;
  }).getStafPermintaan();
  var t=ymd(new Date());
  document.getElementById('p7-tm').min=t; document.getElementById('p7-ts').min=t;
  var today=new Date(), sixM=new Date(); sixM.setMonth(today.getMonth()+6);
  document.getElementById('p7-dari').value=ymd(today);
  document.getElementById('p7-sampai').value=ymd(sixM);
  p7Cari();
}

/* ---- form ajukan ---- */
function p7TmChange(){
  var tm=document.getElementById('p7-tm').value, ts=document.getElementById('p7-ts');
  ts.min=tm||ymd(new Date());
  if(tm && (!ts.value || ts.value<tm)) ts.value=tm;
}
function p7Msg(txt,ok){
  var m=document.getElementById('p7-msg'); m.className='p7-msg '+(ok?'ok':'err'); m.textContent=txt;
  if(ok) setTimeout(function(){ m.className='p7-msg'; }, 5000);
}
function p7Submit(ev){
  ev.preventDefault();
  var data={nama:document.getElementById('p7-nama').value, jenis:document.getElementById('p7-jenis').value,
    mulai:document.getElementById('p7-tm').value, selesai:document.getElementById('p7-ts').value,
    alasan:document.getElementById('p7-alasan').value};
  if(!data.nama){p7Msg('Pilih nama.',false);return false;}
  if(!data.jenis){p7Msg('Pilih jenis permintaan.',false);return false;}
  if(!data.mulai){p7Msg('Isi tanggal mulai.',false);return false;}
  if(!data.selesai) data.selesai=data.mulai;
  var btn=document.getElementById('p7-submit'); btn.disabled=true; btn.textContent='Mengirim…';
  google.script.run.withSuccessHandler(function(raw){
    btn.disabled=false; btn.textContent='Kirim Permintaan';
    var res={}; try{res=JSON.parse(raw);}catch(e){}
    if(res.ok){ p7Msg('✓ Permintaan terkirim, menunggu keputusan admin.',true);
      document.getElementById('p7f').reset(); p7Cari(); }
    else p7Msg('⚠ '+(res.error||'Gagal mengirim.'),false);
  }).withFailureHandler(function(e){
    btn.disabled=false; btn.textContent='Kirim Permintaan'; p7Msg('⚠ '+(e.message||e),false);
  }).submitPermintaan(data);
  return false;
}

/* ---- batalkan ---- */
function p7CancelShow(){
  var nama=document.getElementById('p7-cnama').value;
  var box=document.getElementById('p7-clist');
  if(!nama){ box.innerHTML='<span style="color:var(--muted)">Pilih nama dulu.</span>'; return; }
  P7_CANCEL_NAME=nama;
  box.innerHTML='<span style="color:var(--muted)">Memuat…</span>';
  google.script.run.withSuccessHandler(function(raw){
    var res={rows:[]}; try{res=JSON.parse(raw);}catch(e){}
    p7RenderCancel(res.rows||[]);
  }).withFailureHandler(function(e){ box.innerHTML='<span style="color:var(--warn)">⚠ '+esc(e.message||e)+'</span>'; })
    .listPermintaanByName(nama);
}
function p7RenderCancel(rows){
  var box=document.getElementById('p7-clist');
  if(!rows.length){ box.innerHTML='<span style="color:var(--muted)">Tidak ada permintaan yang akan datang atas nama ini.</span>'; return; }
  var h='';
  rows.forEach(function(r){
    var jw=String(r.jawaban||'').toLowerCase();
    var st = jw.indexOf('setuju')>=0?'<span class="j-ok">'+esc(r.jawaban)+'</span>'
      : jw.indexOf('tolak')>=0?'<span class="j-no">'+esc(r.jawaban)+'</span>'
      : jw==='batal'?'<span class="j-btl">BATAL</span>'
      : '<span class="j-pnd">Menunggu</span>';
    h+='<div class="p7-crow"><div class="info"><strong>'+esc(r.jenis)+'</strong> '+st+
       '<br><small>'+esc(r.mulai)+' s/d '+esc(r.selesai)+'</small></div>'+
       (jw!=='batal'?'<button type="button" class="btn btn-ghost" style="height:30px;font-size:11px" onclick="p7DoCancel('+r.row+')">Batalkan</button>':'')+
       '</div>';
  });
  box.innerHTML=h;
}
function p7DoCancel(row){
  if(!confirm('Batalkan permintaan ini? Statusnya akan menjadi BATAL.')) return;
  google.script.run.withSuccessHandler(function(raw){
    var res={}; try{res=JSON.parse(raw);}catch(e){}
    if(res.ok){ p7CancelShow(); p7Cari(); }
    else alert('Gagal: '+(res.error||'—'));
  }).withFailureHandler(function(e){ alert('Gagal: '+(e.message||e)); })
    .cancelPermintaan(row, P7_CANCEL_NAME);
}

/* ---- tabel jawaban ---- */
function p7Cari(){
  var tm=document.getElementById('p7-dari').value, ta=document.getElementById('p7-sampai').value;
  document.getElementById('p7-cnt').textContent='Memuat…';
  document.getElementById('p7-loader').style.display='block';
  document.getElementById('p7-tbl').style.display='none';
  document.getElementById('p7-empty').style.display='none';
  document.getElementById('p7-err').style.display='none';
  google.script.run.withSuccessHandler(function(raw){
    var obj={rows:[]}; try{obj=JSON.parse(raw);}catch(e){}
    document.getElementById('p7-loader').style.display='none';
    if(obj.error){ document.getElementById('p7-err').style.display='block';
      document.getElementById('p7-err').textContent='⚠ '+obj.error;
      document.getElementById('p7-cnt').textContent='Gagal memuat'; return; }
    P7_ROWS=obj.rows||[]; p7RenderFilter();
  }).withFailureHandler(function(e){
    document.getElementById('p7-loader').style.display='none';
    document.getElementById('p7-err').style.display='block';
    document.getElementById('p7-err').textContent='⚠ '+(e.message||e);
  }).getDaftarDinas(tm,ta);
}
function p7RenderFilter(){
  var q=(document.getElementById('p7-fnama').value||'').trim().toLowerCase();
  var rows=q?P7_ROWS.filter(function(r){return String(r.nama||'').toLowerCase().indexOf(q)>=0;}):P7_ROWS;
  document.getElementById('p7-cnt').textContent=rows.length+' data ditemukan';
  var tbl=document.getElementById('p7-tbl'), empty=document.getElementById('p7-empty');
  if(!rows.length){ tbl.style.display='none'; empty.style.display='block'; return; }
  empty.style.display='none'; tbl.style.display='table';
  var todayStr=ymd(new Date()), tbody=document.getElementById('p7-tbody'); tbody.innerHTML='';
  rows.forEach(function(r,i){
    var tr=document.createElement('tr');
    if(r.tglMulaiRaw===todayStr) tr.style.background='#fffde7';
    var jwb=String(r.jawaban||'').toLowerCase();
    var jwbH = jwb.indexOf('setuju')>=0||jwb.indexOf('approved')>=0 ? '<span class="j-ok">'+esc(r.jawaban)+'</span>'
      : jwb.indexOf('tolak')>=0||jwb.indexOf('reject')>=0 ? '<span class="j-no">'+esc(r.jawaban)+'</span>'
      : jwb.indexOf('batal')>=0||jwb.indexOf('cancel')>=0 ? '<span class="j-btl">'+esc(r.jawaban)+'</span>'
      : r.jawaban ? '<span class="j-pnd">'+esc(r.jawaban)+'</span>' : '<span class="nm">—</span>';
    tr.innerHTML='<td class="nm">'+(i+1)+'</td><td class="nm" style="font-size:10.5px">'+esc(r.timestamp)+'</td>'+
      '<td><strong>'+esc(r.nama)+'</strong></td><td>'+esc(r.tglMulai)+'</td>'+
      '<td class="nm">'+esc(r.tglSelesai)+'</td><td class="nm">'+esc(r.jenis)+'</td>'+
      '<td>'+jwbH+'</td><td class="nm">'+esc(r.alasan)+'</td>';
    tbody.appendChild(tr);
  });
}
function p7Reset(){
  var today=new Date(), sixM=new Date(); sixM.setMonth(today.getMonth()+6);
  document.getElementById('p7-dari').value=ymd(today);
  document.getElementById('p7-sampai').value=ymd(sixM);
  document.getElementById('p7-fnama').value='';
  p7Cari();
}
</script>
